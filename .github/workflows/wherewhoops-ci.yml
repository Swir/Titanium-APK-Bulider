name: WhereWhoops APK temp

on:
  push:
    branches: [ wherewhoops-ci-temp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK diagnostics
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" | tail -20 || true
          ls -la "$ANDROID_HOME/build-tools" | tail -20 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: wherewhoops-ci
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WhereWhoops-0.1.0-alpha-test1
          path: wherewhoops-ci/app/build/outputs/apk/debug/app-debug.apk
