name: Build SWIR Czateria APK

on:
  push:
    branches:
      - swir-czateria-apk
    paths:
      - 'SWIR_Czateria_Android/**'
      - '.github/workflows/build-swir-czateria.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check SWIR JavaScript syntax
        run: |
          node --check SWIR_Czateria_Android/app/src/main/assets/swir_app.js
          node --check SWIR_Czateria_Android/app/src/main/assets/swir_patch_v03.js
          node --check SWIR_Czateria_Android/app/src/main/assets/swir_patch_v04.js

      - name: Build debug APK
        working-directory: SWIR_Czateria_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp SWIR_Czateria_Android/app/build/outputs/apk/debug/app-debug.apk dist/SWIR-Czateria-v0.5-debug.apk
          sha256sum dist/SWIR-Czateria-v0.5-debug.apk > dist/SWIR-Czateria-v0.5-debug.apk.sha256

      - name: Upload ready APK
        uses: actions/upload-artifact@v4
        with:
          name: SWIR-Czateria-v0.5-APK
          path: dist/*
          retention-days: 30
