name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v9.0.0)
        required: true
        default: v9.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "v9.0.0"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pyinstaller

      - name: Validate source
        shell: pwsh
        run: python -m py_compile "Titanium V9.py"

      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Titanium-APK-Builder" --hidden-import PIL.ImageTk "Titanium V9.py"

      - name: Package release
        shell: pwsh
        run: |
          $package = "Titanium-APK-Builder-$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/Titanium-APK-Builder.exe" "release/Titanium-APK-Builder.exe"
          Copy-Item "README.md" "release/README.md"
          $zip = "$package.zip"
          Compress-Archive -Path "release/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows GUI package. Building Android APKs still requires a compatible external Android/Cordova toolchain (Node.js, Cordova, JDK, Android SDK/Android Studio and Gradle); those components are not bundled in this EXE."
          if (gh release view $env:VERSION --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:VERSION "dist/Titanium-APK-Builder.exe" $env:ZIP_NAME "$env:ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION "dist/Titanium-APK-Builder.exe" $env:ZIP_NAME "$env:ZIP_NAME.sha256" --target "${{ github.sha }}" --title "Titanium APK Builder $env:VERSION" --notes $notes --repo "${{ github.repository }}"
          }
