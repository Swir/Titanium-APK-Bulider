name: Titanium v10 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v10.0.0
        required: true
        default: v10.0.0
  push:
    tags:
      - "v10.*"
    branches:
      - "release/v10.0.0"
  pull_request:
    paths:
      - "Titanium V10.py"
      - "titanium/**"
      - "tests/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/v10-release.yml"

concurrency:
  group: titanium-v10-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } elseif ("${{ github.event_name }}" -eq "pull_request") {
            $v = "v10.0.0-rc-ci"
          } elseif ("${{ github.ref_name }}" -eq "release/v10.0.0") {
            $v = "v10.0.0"
          } else {
            $v = "${{ github.ref_name }}"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test source
        shell: pwsh
        run: |
          python -m py_compile "Titanium V10.py" titanium/__init__.py titanium/core.py titanium/builder.py titanium/builder_base.py titanium/validator.py titanium/analyzer.py
          python -m unittest discover -s tests -v

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0"
          pyinstaller --noconfirm --clean --onefile --windowed --name "Titanium-APK-Builder" "Titanium V10.py"

      - name: Smoke-launch standalone EXE without Python runtime paths
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/Titanium-APK-Builder.exe").Path
          $oldPath = $env:PATH
          $oldPythonHome = $env:PYTHONHOME
          $oldPythonPath = $env:PYTHONPATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Standalone EXE exited during launch smoke test with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
          finally {
            $env:PATH = $oldPath
            if ($null -ne $oldPythonHome) { $env:PYTHONHOME = $oldPythonHome } else { Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue }
            if ($null -ne $oldPythonPath) { $env:PYTHONPATH = $oldPythonPath } else { Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue }
          }

      - name: Build verified Portable Runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path portable/runtime,portable/licenses | Out-Null
          Copy-Item dist/Titanium-APK-Builder.exe portable/Titanium-APK-Builder.exe
          Copy-Item README.md,ROADMAP.md,CHANGELOG.md,THIRD_PARTY_NOTICES.md,SECURITY.md,TROUBLESHOOTING.md,MIGRATION_V9_TO_V10.md portable/

          $jdkMetaUri = "https://api.adoptium.net/v3/assets/latest/21/hotspot?architecture=x64&image_type=jdk&os=windows&vendor=eclipse&heap_size=normal"
          $jdkMeta = Invoke-RestMethod -Uri $jdkMetaUri
          $jdkPackage = $jdkMeta[0].binary.package
          Invoke-WebRequest -Uri $jdkPackage.link -OutFile jdk.zip
          $jdkActual = (Get-FileHash jdk.zip -Algorithm SHA256).Hash.ToLower()
          $jdkExpected = $jdkPackage.checksum.ToLower()
          if ($jdkActual -ne $jdkExpected) { throw "Temurin JDK SHA-256 verification failed" }
          Expand-Archive jdk.zip -DestinationPath jdk-extract -Force
          $jdkRoot = Get-ChildItem jdk-extract -Directory | Select-Object -First 1
          Copy-Item $jdkRoot.FullName portable/runtime/jdk -Recurse

          $gradleUri = "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          Invoke-WebRequest -Uri $gradleUri -OutFile gradle.zip
          Invoke-WebRequest -Uri "$gradleUri.sha256" -OutFile gradle.zip.sha256
          $gradleExpected = (Get-Content gradle.zip.sha256 -Raw).Trim().Split()[0].ToLower()
          $gradleActual = (Get-FileHash gradle.zip -Algorithm SHA256).Hash.ToLower()
          if ($gradleActual -ne $gradleExpected) { throw "Gradle SHA-256 verification failed" }
          Expand-Archive gradle.zip -DestinationPath gradle-extract -Force
          $gradleRoot = Get-ChildItem gradle-extract -Directory | Select-Object -First 1
          Copy-Item $gradleRoot.FullName portable/runtime/gradle -Recurse

          $bundletoolVersion = "1.18.3"
          $bundletoolExpected = "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          $bundletoolDir = "portable/runtime/bundletool"
          New-Item -ItemType Directory -Force -Path $bundletoolDir | Out-Null
          $bundletoolJar = "$bundletoolDir/bundletool-all-$bundletoolVersion.jar"
          Invoke-WebRequest -Uri "https://github.com/google/bundletool/releases/download/$bundletoolVersion/bundletool-all-$bundletoolVersion.jar" -OutFile $bundletoolJar
          $bundletoolActual = (Get-FileHash $bundletoolJar -Algorithm SHA256).Hash.ToLower()
          if ($bundletoolActual -ne $bundletoolExpected) { throw "bundletool SHA-256 verification failed" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/bundletool/$bundletoolVersion/LICENSE" -OutFile "portable/licenses/bundletool-LICENSE.txt"

          $java = Get-ChildItem portable/runtime/jdk -Recurse -Filter java.exe | Select-Object -First 1
          $jarsigner = Get-ChildItem portable/runtime/jdk -Recurse -Filter jarsigner.exe | Select-Object -First 1
          $gradle = Get-ChildItem portable/runtime/gradle -Recurse -Filter gradle.bat | Select-Object -First 1
          if (-not $java) { throw "Portable JDK validation failed: java.exe missing" }
          if (-not $jarsigner) { throw "Portable JDK validation failed: jarsigner.exe missing" }
          if (-not $gradle) { throw "Portable Gradle validation failed: gradle.bat missing" }
          if (-not (Test-Path $bundletoolJar)) { throw "Portable bundletool validation failed: JAR missing" }
          if (-not (Test-Path "portable/licenses/bundletool-LICENSE.txt")) { throw "Portable bundletool validation failed: LICENSE missing" }

          & $java.FullName -jar $bundletoolJar version
          if ($LASTEXITCODE -ne 0) { throw "Portable bundletool execution test failed" }
          & $gradle.FullName --version | Select-Object -First 20
          if ($LASTEXITCODE -ne 0) { throw "Portable Gradle execution test failed" }

          $portableExe = (Resolve-Path "portable/Titanium-APK-Builder.exe").Path
          $oldPath = $env:PATH
          $oldPythonHome = $env:PYTHONHOME
          $oldPythonPath = $env:PYTHONPATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $portableExe -WorkingDirectory (Resolve-Path "portable").Path -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Portable EXE exited during package smoke test with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
          finally {
            $env:PATH = $oldPath
            if ($null -ne $oldPythonHome) { $env:PYTHONHOME = $oldPythonHome } else { Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue }
            if ($null -ne $oldPythonPath) { $env:PYTHONPATH = $oldPythonPath } else { Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue }
          }

          $exeAsset = "Titanium-APK-Builder-$env:VERSION-Windows-x64.exe"
          Copy-Item dist/Titanium-APK-Builder.exe $exeAsset
          $exeHash = (Get-FileHash $exeAsset -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $exeAsset" | Set-Content "$exeAsset.sha256"

          $zip = "Titanium-APK-Builder-$env:VERSION-Portable-Windows-x64.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zip" | Set-Content "$zip.sha256"

      - name: Upload release-candidate package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titanium-v10-release-package
          path: |
            Titanium-APK-Builder-*-Windows-x64.exe
            Titanium-APK-Builder-*-Windows-x64.exe.sha256
            Titanium-APK-Builder-*-Portable-Windows-x64.zip
            Titanium-APK-Builder-*-Portable-Windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "release/v10.0.0" ]; then
            echo "VERSION=v10.0.0" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Download verified package artifacts
        uses: actions/download-artifact@v4
        with:
          name: titanium-v10-release-package
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          EXE="Titanium-APK-Builder-${VERSION}-Windows-x64.exe"
          PORTABLE_ZIP="Titanium-APK-Builder-${VERSION}-Portable-Windows-x64.zip"
          test -f "$EXE"
          test -f "$EXE.sha256"
          test -f "$PORTABLE_ZIP"
          test -f "$PORTABLE_ZIP.sha256"
          NOTES=$(cat <<'EOF'
          Titanium APK Builder v10 stable release.

          - Standalone Windows EXE: no Python or Android Studio installation required.
          - Portable Windows package: Titanium EXE + SHA-256-verified Eclipse Temurin JDK 21 + Gradle 9.6.0 + Google bundletool 1.18.3 and its Apache 2.0 license.
          - Native HTML / ZIP / URL to APK or AAB generation targeting Android API 36.
          - Debug and signed Release builds, WebView runtime permissions, uploads/downloads, external links and HTML5 fullscreen.
          - Project Analyzer, managed Build Engine Prepare/Repair, and post-build APK/AAB validation.
          - Android SDK components are intentionally not redistributed; Titanium provisions them after explicit Android SDK license acceptance.

          The exact release-package path is smoke-tested in CI before publication. SHA-256 checksum files are included for both downloadable artifacts.
          EOF
          )
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$EXE" "$EXE.sha256" "$PORTABLE_ZIP" "$PORTABLE_ZIP.sha256" --clobber --repo "${{ github.repository }}"
          elif [[ "$VERSION" == *-* ]]; then
            gh release create "$VERSION" "$EXE" "$EXE.sha256" "$PORTABLE_ZIP" "$PORTABLE_ZIP.sha256" --target "${{ github.sha }}" --title "Titanium APK Builder $VERSION" --notes "$NOTES" --prerelease --repo "${{ github.repository }}"
          else
            gh release create "$VERSION" "$EXE" "$EXE.sha256" "$PORTABLE_ZIP" "$PORTABLE_ZIP.sha256" --target "${{ github.sha }}" --title "Titanium APK Builder $VERSION" --notes "$NOTES" --repo "${{ github.repository }}"
          fi
