name: Titanium v10 CI

on:
  push:
    branches:
      - v10-development
      - "v10-*"
      - main
    paths:
      - "Titanium V10.py"
      - "titanium/**"
      - "tests/**"
      - ".github/workflows/v10-ci.yml"
  pull_request:
    paths:
      - "Titanium V10.py"
      - "titanium/**"
      - "tests/**"
      - ".github/workflows/v10-ci.yml"
  workflow_dispatch:

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python
        shell: pwsh
        run: |
          python -m py_compile "Titanium V10.py" titanium/__init__.py titanium/core.py titanium/builder.py titanium/analyzer.py
          python -m unittest discover -s tests -v

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0"
          pyinstaller --noconfirm --clean --onefile --windowed --name "Titanium-APK-Builder-v10" "Titanium V10.py"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Titanium-APK-Builder-v10-Windows-x64
          path: dist/Titanium-APK-Builder-v10.exe
          if-no-files-found: error

  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate sample app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from titanium.builder import AndroidBuilder
          class P:
              root=Path('/tmp/titanium-ci')
              workspace=root/'workspace'
          P.root.mkdir(parents=True,exist_ok=True); P.workspace.mkdir(parents=True,exist_ok=True)
          class T: pass
          web=Path('/tmp/titanium-web'); web.mkdir(exist_ok=True); (web/'index.html').write_text('<h1>Titanium CI</h1>',encoding='utf-8')
          c={"app_name":"TitaniumCI","package":"com.swir.titaniumci","version_name":"1.0.0","version_code":"1","min_sdk":"24","target_sdk":"36","source_type":"Folder","source":str(web),"output_dir":"/tmp/out","export_format":"APK","build_mode":"Debug","orientation":"unspecified","camera":False,"microphone":False,"location":False,"sign_release":False,"keystore":"","store_password":"","key_alias":"","key_password":""}
          AndroidBuilder(P,T(),lambda *_:None).generate(c)
          PY

      - name: Build generated APK
        working-directory: /tmp/titanium-ci/workspace/current
        run: gradle --no-daemon --console=plain assembleDebug
