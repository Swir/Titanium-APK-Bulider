<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#m{height:100%;margin:0;background:#050814}.leaflet-container{background:#050814}.leaflet-tile{filter:invert(100%) hue-rotate(180deg) brightness(72%) contrast(92%) saturate(72%)}.leaflet-control-attribution{background:#050814cc!important;color:#9ab!important}.leaflet-control-attribution a{color:#25c9ff!important}.pin{width:20px;height:20px;border-radius:50%;background:#25c9ff;border:4px solid white;box-shadow:0 0 18px #25c9ff}</style></head><body><div id="m"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('m').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);const i=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[28,28],iconAnchor:[14,14]});let x;window.setPoint=(a,b,z)=>{if(x)m.removeLayer(x);x=L.marker([a,b],{icon:i}).addTo(m);m.setView([a,b],z||15)};m.on('click',e=>{setPoint(e.latlng.lat,e.latlng.lng,15);if(window.Android)Android.onMapTap(e.latlng.lat,e.latlng.lng)});</script></body></html>
