plugins { id 'com.android.application' }

android {
    namespace 'com.swir.wherewhoops'
    compileSdk 36

    defaultConfig {
        applicationId 'com.swir.wherewhoops'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-alpha-test1'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
